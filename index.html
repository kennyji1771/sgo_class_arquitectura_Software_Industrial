<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SGO Class · Arquitectura de Software Industrial</title>
    <link rel="icon" href="img/logo_sgo_class.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/lib/codemirror.css">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.13/mode/python/python.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #05070f; color: #e2e8f0; line-height: 1.5; transition: background 0.3s; }
        body.dark-mode { background: #010105; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
        .header { background: linear-gradient(135deg, #0a0f1f, #1a1a3a, #00b4d8); border-radius: 2rem; padding: 1rem 1.5rem; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 0.8rem; }
        .logo img { height: 45px; border-radius: 12px; }
        .logo h1 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(to right, #00f3ff, #00ff9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav button, .nav a { color: #fff; background: rgba(0,243,255,0.15); border: 1px solid rgba(0,243,255,0.4); border-radius: 2rem; padding: 0.4rem 0.8rem; cursor: pointer; font-family: inherit; font-size: 0.8rem; margin: 0 0.2rem; }
        .main-layout { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .sidebar { width: 280px; background: rgba(10,15,31,0.9); border-radius: 1.5rem; padding: 1rem; border: 1px solid rgba(0,243,255,0.3); }
        .content-area { flex: 1; background: rgba(10,15,31,0.9); border-radius: 1.5rem; padding: 1.5rem; border: 1px solid rgba(0,243,255,0.3); }
        .tree { list-style: none; }
        .tree details { margin-left: 0.5rem; margin-top: 0.2rem; }
        .tree summary { font-weight: 600; color: #00ff9d; cursor: pointer; font-size: 0.9rem; }
        .tema-item { padding-left: 1rem; margin: 0.2rem 0; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
        .tema-item.completado { text-decoration: line-through; opacity: 0.6; }
        .btn-completar { background: #00ff9d; color: #05070f; border: none; padding: 0.3rem 0.8rem; border-radius: 2rem; font-weight: 700; margin: 0.5rem 0; cursor: pointer; }
        .CodeMirror { height: auto; min-height: 160px; border-radius: 1rem; background: #0a0f1f; }
        .terminal { background: #010105; padding: 0.8rem; border-radius: 1rem; font-family: monospace; font-size: 0.75rem; margin-top: 1rem; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
        .intro-block { background: rgba(10,15,31,0.85); border-radius: 2rem; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid rgba(0,243,255,0.5); }
        .badge-item { background: rgba(0,243,255,0.1); border-radius: 2rem; padding: 0.2rem 1rem; display: inline-block; margin-right: 0.5rem; color: #00ff9d; }
        .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 0.8rem; }
        input, select { width: 100%; padding: 0.5rem; border-radius: 1rem; background: #0a0f1f; border: 1px solid #00f3ff55; color: white; }
        .btn-submit { background: #00f3ff; color: #05070f; font-weight: bold; padding: 0.5rem; border-radius: 2rem; cursor: pointer; width: 100%; margin-top: 0.8rem; border: none; }
        .loader { display: inline-block; width: 18px; height: 18px; border: 2px solid #00f3ff; border-radius: 50%; border-top-color: transparent; animation: spin 0.6s linear infinite; margin-left: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .resumen-tree { background: rgba(0,255,157,0.05); border-radius: 0.8rem; padding: 0.5rem; font-family: monospace; white-space: pre-wrap; margin: 0.5rem 0; }
        .oculto { display: none; }
        .drawer { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #0a0f1f; border-right: 2px solid #00f3ff; transition: left 0.3s; padding: 1rem; z-index: 200; }
        .drawer.open { left: 0; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 199; display: none; }
        .drawer-overlay.open { display: block; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 300; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #0a0f1f; border-radius: 1.5rem; padding: 1rem; width: 90%; max-width: 400px; border: 1px solid #00f3ff; }
        @media (max-width: 700px) { .sidebar { width: 100%; } .main-layout { flex-direction: column; } .logo h1 { font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <div class="logo">
            <img src="img/logo_sgo_class.png" alt="Logo" onerror="this.style.display='none'">
            <h1>SGO Class</h1>
        </div>
        <div class="nav">
            <button id="profileBtn"><i class="fas fa-user"></i> Perfil</button>
            <button id="attendanceBtn"><i class="fas fa-calendar"></i> Asistencia</button>
            <button id="adminBtn"><i class="fas fa-cog"></i> Admin</button>
            <button id="darkModeToggle">🌙</button>
        </div>
    </header>

    <!-- PANTALLA DE ACCESO (CÉDULA + BOTÓN) -->
    <div id="accesoPanel" class="intro-block">
        <h2>🔐 Acceso al Laboratorio</h2>
        <p>Ingresa tu cédula para iniciar tu práctica</p>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 1rem;">
            <input type="text" id="cedulaInput" placeholder="Número de cédula" style="flex: 2; min-width: 180px;">
            <button id="btnAcceder" class="btn-submit" style="width: auto; margin-top: 0;">Acceder</button>
        </div>
        <div id="accesoStatus" class="mensaje-info" style="display:none; margin-top: 1rem;"></div>
        <div id="accesoLoader" style="display:none; margin-top: 0.5rem;"><span class="loader"></span> Verificando...</div>
    </div>

    <!-- FORMULARIO REGISTRO (con teléfono y correo) -->
    <div id="registroPanel" class="intro-block oculto">
        <h2>📝 Registro de Arquitecto</h2>
        <div class="grid-2">
            <input type="text" id="regNombres" placeholder="Nombres *">
            <input type="text" id="regApellidos" placeholder="Apellidos *">
            <input type="tel" id="regTelefono" placeholder="Teléfono *">
            <input type="email" id="regEmail" placeholder="Correo *">
            <select id="regNucleo"><option>La Floresta</option><option>Altagracia</option></select>
            <select id="regSemestre"><option>I</option><option>II</option><option>III</option><option>IV</option></select>
        </div>
        <button id="btnRegistrar" class="btn-submit">Registrar y acceder</button>
        <button id="btnVolverAcceso" class="btn-submit" style="background:#555; margin-top:0.5rem;">Volver</button>
    </div>

    <!-- CONTENIDO PRINCIPAL DEL CURSO (se muestra tras login) -->
    <div id="contenidoCurso" class="oculto">
        <div class="main-layout">
            <div class="sidebar">
                <h3><i class="fas fa-cubes"></i> Fases y Módulos</h3>
                <div id="arbolNavegacion"></div>
            </div>
            <div class="content-area">
                <div id="contenidoTema"></div>
                <button id="btnCompletarTema" class="btn-completar" style="display:none;">✓ Completar tema</button>
                <div class="editor-panel" style="margin-top: 1.5rem;">
                    <h3>🐍 Laboratorio Python</h3>
                    <textarea id="codeEditor"></textarea>
                    <button id="runCodeBtn" class="btn-completar">Ejecutar código</button>
                    <div id="terminal" class="terminal">>> Listo</div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-note" style="text-align:center; font-size:0.7rem; margin-top:2rem;">SGO Class · Arquitectura de Software Industrial</div>
</div>

<!-- Drawer perfil -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="profileDrawer"><button class="close-drawer" id="closeDrawerBtn">&times;</button><h3>Mi perfil</h3><div id="drawerInfo"></div></div>

<!-- Modales -->
<div id="attendanceModal" class="modal"><div class="modal-content"><span class="modal-close" id="closeAttendanceModal">&times;</span><h3>Asistencia</h3><input type="date" id="attDate"><select id="attClase"></select><select id="attStatus"><option>Sí</option><option>No</option></select><button id="saveAttendanceBtn">Guardar</button></div></div>
<div id="adminModal" class="modal"><div class="modal-content"><span class="modal-close" id="closeAdminModal">&times;</span><h3>Admin</h3><input type="password" id="adminPass" placeholder="Contraseña"><button id="loginAdminBtn">Acceder</button><div id="adminPanel" style="display:none; margin-top:1rem;">Configuración (demo)</div></div></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
<script>
    // ---------- CONFIGURACIÓN ----------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_ZbCVN8NLgRhIr68Cax57pJAFOX04_XGtKE7gSU7kfhyPO7EgAxV3Mf1qFBCIW75bZA/exec";
    let usuario = { cedula: '', nombres: '', apellidos: '', telefono: '', email: '', nucleo: '', semestre: '' };
    let progreso = {};
    let editor = null;
    let pyodide = null;
    let temaActual = null;

    // ---------- ESTRUCTURA DEL CURSO (8 módulos, resúmenes tipo tree) ----------
    const estructuraCurso = {
        trayectos: [{
            titulo: "Arquitectura de Software Industrial",
            semestres: [
                { titulo: "⚙️ FASE I: Infraestructura", clases: [
                    { id: "mod1", titulo: "Módulo 1: Patrones de Diseño", temas: [
                        { id: "t1_1", titulo: "1.1 Singleton", contenido: { texto: "Singleton asegura una única instancia.", resumen: "📁 Estructura:\nconfig/\n└── rules.json\nsrc/\n├── config_manager.py (Singleton)", codigo: "class ConfigManager:\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n        return cls._instance" } },
                        { id: "t1_2", titulo: "1.2 Command y Strategy", contenido: { texto: "Command separa solicitud, Strategy permite dry-run.", resumen: "🔄 Modos: Command (organizar) / Strategy (simulación)", codigo: "class SimulationStrategy:\n    def execute(self): return 'simulación'" } }
                    ] },
                    { id: "mod2", titulo: "Módulo 2: FS Automation", temas: [
                        { id: "t2_1", titulo: "2.1 pathlib y logging", contenido: { texto: "pathlib para rutas, logging para trazabilidad.", resumen: "📂 Librerías: pathlib, os, logging", codigo: "from pathlib import Path\nPath('output').mkdir(exist_ok=True)" } },
                        { id: "t2_2", titulo: "2.2 Dry-run", contenido: { texto: "Previsualiza cambios sin mover archivos.", resumen: "🛡️ Simulación segura con flag --dry-run", codigo: "class DryRunStrategy: def move(self,src,dst): print(f'[DRY] {src} -> {dst}')" } }
                    ] }
                ] },
                { titulo: "🧠 FASE II: Inteligencia", clases: [
                    { id: "mod3", titulo: "Módulo 3: Computer Vision", temas: [{ id: "t3_1", titulo: "Hashing Perceptual", contenido: { texto: "A-Hash y D-Hash con OpenCV", resumen: "🖼️ D-Hash:\n- resize\n- diff gradientes\n- fingerprint", codigo: "def d_hash(img):\n    # implementación conceptual" } }] },
                    { id: "mod4", titulo: "Módulo 4: Audio", temas: [{ id: "t4_1", titulo: "Vectorización", contenido: { texto: "Extracción de features con NumPy", resumen: "🎵 Convertir audio a vectores", codigo: "import numpy as np\ndef extract(a): return np.mean(a)" } }] },
                    { id: "mod5", titulo: "Módulo 5: TF-IDF", temas: [{ id: "t5_1", titulo: "Coseno de Similitud", contenido: { texto: "TF-IDF + coseno", resumen: "📄 Similitud entre documentos", codigo: "from sklearn.feature_extraction.text import TfidfVectorizer" } }] },
                    { id: "mod6", titulo: "Módulo 6: Clustering", temas: [{ id: "t6_1", titulo: "KMeans", contenido: { texto: "Agrupación no supervisada", resumen: "🧩 Scikit-learn KMeans", codigo: "from sklearn.cluster import KMeans" } }] }
                ] },
                { titulo: "💻 FASE III: CLI UX", clases: [{ id: "mod7", titulo: "Módulo 7: Click y Rich", temas: [{ id: "t7_1", titulo: "CLI industrial", contenido: { texto: "Comandos organizar, limpiar, reporte", resumen: "⌨️ Click + Rich", codigo: "@click.command()\ndef organizar(): ..." } }] }] },
                { titulo: "💎 FASE IV: Calidad", clases: [{ id: "mod8", titulo: "Módulo 8: Testing", temas: [{ id: "t8_1", titulo: "Pytest y MyPy", contenido: { texto: "Pruebas unitarias y tipado estático", resumen: "🧪 pytest, mypy, black", codigo: "def test_suma(): assert suma(2,2)==4" } }] }]
            ]
        }]
    };

    // ---------- FUNCIONES ----------
    function mostrarMensaje(divId, texto, tipo) {
        let d = document.getElementById(divId);
        if(!d) return;
        d.style.display = "block";
        d.className = `mensaje-${tipo}`;
        d.innerHTML = texto;
        setTimeout(() => d.style.display = "none", 4000);
    }

    async function verificarUsuario(cedula) {
        const loader = document.getElementById("accesoLoader");
        const statusDiv = document.getElementById("accesoStatus");
        loader.style.display = "inline-block";
        statusDiv.style.display = "none";
        try {
            const resp = await fetch(`${SCRIPT_URL}?cedula=${encodeURIComponent(cedula)}`);
            const data = await resp.json();
            if(data.exists) {
                usuario = {
                    cedula: data.cedula,
                    nombres: data.nombres || '',
                    apellidos: data.apellidos || '',
                    telefono: data.telefono || '',
                    email: data.email || '',
                    nucleo: data.nucleo || '',
                    semestre: data.semestre || ''
                };
                await cargarProgreso(cedula);
                document.getElementById("accesoPanel").classList.add("oculto");
                document.getElementById("contenidoCurso").classList.remove("oculto");
                construirArbol();
                const primer = estructuraCurso.trayectos[0].semestres[0].clases[0].temas[0];
                mostrarTema(primer, estructuraCurso.trayectos[0].semestres[0].clases[0]);
                actualizarDrawer();
            } else {
                mostrarMensaje("accesoStatus", "Usuario no registrado. Complete el formulario.", "info");
                document.getElementById("accesoPanel").classList.add("oculto");
                document.getElementById("registroPanel").classList.remove("oculto");
            }
        } catch(e) {
            console.error(e);
            mostrarMensaje("accesoStatus", "Error de conexión con Google Sheets", "error");
        } finally {
            loader.style.display = "none";
        }
    }

    async function registrarNuevoUsuario() {
        let cedula = document.getElementById("cedulaInput").value.trim();
        let nombres = document.getElementById("regNombres").value.trim();
        let apellidos = document.getElementById("regApellidos").value.trim();
        let telefono = document.getElementById("regTelefono").value.trim();
        let email = document.getElementById("regEmail").value.trim();
        let nucleo = document.getElementById("regNucleo").value;
        let semestre = document.getElementById("regSemestre").value;
        if(!cedula || !nombres || !apellidos || !telefono || !email) {
            alert("Complete todos los campos obligatorios");
            return;
        }
        let fd = new FormData();
        fd.append("accion", "registro");
        fd.append("cedula", cedula);
        fd.append("nombres", nombres);
        fd.append("apellidos", apellidos);
        fd.append("telefono", telefono);
        fd.append("email", email);
        fd.append("nucleo", nucleo);
        fd.append("pnf", "Arquitectura Software");
        fd.append("trayecto", "Arquitectura Industrial");
        fd.append("semestre", semestre);
        try {
            let resp = await fetch(SCRIPT_URL, { method: "POST", body: fd });
            let data = await resp.json();
            if(data.result === "success") {
                usuario = { cedula, nombres, apellidos, telefono, email, nucleo, semestre };
                await cargarProgreso(cedula);
                document.getElementById("registroPanel").classList.add("oculto");
                document.getElementById("contenidoCurso").classList.remove("oculto");
                construirArbol();
                const primer = estructuraCurso.trayectos[0].semestres[0].clases[0].temas[0];
                mostrarTema(primer, estructuraCurso.trayectos[0].semestres[0].clases[0]);
                actualizarDrawer();
                alert("Registro exitoso");
            } else throw new Error(data.message);
        } catch(e) { alert("Error: " + e.message); }
    }

    async function cargarProgreso(cedula) {
        try {
            let resp = await fetch(`${SCRIPT_URL}?cedula=${cedula}&accion=progreso`);
            let data = await resp.json();
            if(data.progreso) progreso = data.progreso;
        } catch(e) {}
    }

    async function marcarCompletado(tema) {
        if(progreso[tema.id]) return;
        let fd = new FormData();
        fd.append("accion", "progreso");
        fd.append("cedula", usuario.cedula);
        fd.append("temaId", tema.id);
        fd.append("temaTitulo", tema.titulo);
        try {
            let resp = await fetch(SCRIPT_URL, { method: "POST", body: fd });
            let data = await resp.json();
            if(data.result === "success") {
                progreso[tema.id] = true;
                document.querySelector(`.tema-item[data-id="${tema.id}"] i`).className = "fas fa-check-circle";
                document.querySelector(`.tema-item[data-id="${tema.id}"]`).classList.add("completado");
                document.getElementById("btnCompletarTema").style.display = "none";
            }
        } catch(e) {}
    }

    // ----- Árbol de navegación -----
    function construirArbol() {
        const cont = document.getElementById("arbolNavegacion");
        cont.innerHTML = "";
        const raiz = estructuraCurso.trayectos[0];
        const ul = document.createElement("ul"); ul.className = "tree";
        raiz.semestres.forEach(sem => {
            const liSem = document.createElement("li");
            const det = document.createElement("details");
            const sum = document.createElement("summary");
            sum.innerHTML = `<i class="fas fa-folder"></i> ${sem.titulo}`;
            det.appendChild(sum);
            const ulClases = document.createElement("ul");
            sem.clases.forEach(cls => {
                const liCls = document.createElement("li");
                const detCls = document.createElement("details");
                const sumCls = document.createElement("summary");
                sumCls.innerHTML = `<i class="fas fa-book"></i> ${cls.titulo}`;
                detCls.appendChild(sumCls);
                const ulTemas = document.createElement("ul");
                cls.temas.forEach(tema => {
                    const liTema = document.createElement("li");
                    liTema.className = "tema-item";
                    if(progreso[tema.id]) liTema.classList.add("completado");
                    liTema.setAttribute("data-id", tema.id);
                    const icon = document.createElement("i");
                    icon.className = progreso[tema.id] ? "fas fa-check-circle" : "far fa-circle";
                    const span = document.createElement("span");
                    span.textContent = tema.titulo;
                    liTema.appendChild(icon);
                    liTema.appendChild(span);
                    liTema.onclick = (e) => { e.stopPropagation(); mostrarTema(tema, cls); };
                    ulTemas.appendChild(liTema);
                });
                detCls.appendChild(ulTemas);
                liCls.appendChild(detCls);
                ulClases.appendChild(liCls);
            });
            det.appendChild(ulClases);
            liSem.appendChild(det);
            ul.appendChild(liSem);
        });
        cont.appendChild(ul);
    }

    function mostrarTema(tema, clase) {
        temaActual = tema;
        const divContenido = document.getElementById("contenidoTema");
        let html = `<h2>${tema.titulo}</h2>`;
        html += `<div class="resumen-tree"><i class="fas fa-tree"></i> <strong>Estructura / Resumen</strong><pre>${escapeHtml(tema.contenido.resumen || "—")}</pre></div>`;
        html += `<p>${tema.contenido.texto.replace(/\n/g, "<br>")}</p>`;
        html += `<pre><code>${escapeHtml(tema.contenido.codigo || "# ejemplo")}</code></pre>`;
        divContenido.innerHTML = html;

        if(editor) editor.setValue(tema.contenido.codigo || "# Escribe aquí");
        else editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), { mode: "python", lineNumbers: true });

        const btnComp = document.getElementById("btnCompletarTema");
        if(progreso[tema.id]) btnComp.style.display = "none";
        else { btnComp.style.display = "inline-block"; btnComp.onclick = () => marcarCompletado(tema); }
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    function actualizarDrawer() {
        document.getElementById("drawerInfo").innerHTML = `
            <p><i class="fas fa-id-card"></i> ${usuario.cedula}</p>
            <p><i class="fas fa-user"></i> ${usuario.nombres} ${usuario.apellidos}</p>
            <p><i class="fas fa-phone"></i> ${usuario.telefono || "—"}</p>
            <p><i class="fas fa-envelope"></i> ${usuario.email || "—"}</p>
            <p><i class="fas fa-graduation-cap"></i> ${usuario.semestre}</p>
        `;
    }

    async function initPyodide() {
        if(!pyodide) {
            pyodide = await loadPyodide();
            await pyodide.loadPackage(["numpy"]);
            document.getElementById("terminal").innerHTML = ">> Pyodide listo";
        }
    }
    document.getElementById("runCodeBtn").onclick = async () => {
        if(!pyodide) await initPyodide();
        let code = editor.getValue();
        let term = document.getElementById("terminal");
        term.innerHTML = ">> Ejecutando...\n";
        try {
            let out = await pyodide.runPythonAsync(code);
            term.innerHTML += `>> ${out || "Sin salida"}`;
        } catch(e) { term.innerHTML += `>> ❌ ${e.message}`; }
    };

    // ----- EVENTOS -----
    window.addEventListener("DOMContentLoaded", async () => {
        await initPyodide();
        document.getElementById("btnAcceder").onclick = () => {
            let ced = document.getElementById("cedulaInput").value.trim();
            if(ced.length < 4) { alert("Ingrese cédula válida"); return; }
            verificarUsuario(ced);
        };
        document.getElementById("btnRegistrar").onclick = registrarNuevoUsuario;
        document.getElementById("btnVolverAcceso").onclick = () => {
            document.getElementById("registroPanel").classList.add("oculto");
            document.getElementById("accesoPanel").classList.remove("oculto");
        };
        document.getElementById("profileBtn").onclick = () => { document.getElementById("profileDrawer").classList.add("open"); document.getElementById("drawerOverlay").classList.add("open"); };
        document.getElementById("closeDrawerBtn").onclick = () => { document.getElementById("profileDrawer").classList.remove("open"); document.getElementById("drawerOverlay").classList.remove("open"); };
        document.getElementById("drawerOverlay").onclick = () => { document.getElementById("profileDrawer").classList.remove("open"); document.getElementById("drawerOverlay").classList.remove("open"); };
        document.getElementById("attendanceBtn").onclick = () => {
            if(!usuario.cedula) { alert("Inicie sesión primero"); return; }
            document.getElementById("attDate").value = new Date().toISOString().slice(0,10);
            // llenar select de clases
            let sel = document.getElementById("attClase");
            sel.innerHTML = "";
            estructuraCurso.trayectos[0].semestres.forEach(s => s.clases.forEach(c => { let opt = document.createElement("option"); opt.value = c.id; opt.textContent = c.titulo; sel.appendChild(opt); }));
            document.getElementById("attendanceModal").classList.add("active");
        };
        document.getElementById("saveAttendanceBtn").onclick = async () => {
            let fd = new FormData();
            fd.append("accion", "asistencia");
            fd.append("cedula", usuario.cedula);
            fd.append("fecha", document.getElementById("attDate").value);
            fd.append("claseId", document.getElementById("attClase").value);
            fd.append("presente", document.getElementById("attStatus").value);
            await fetch(SCRIPT_URL, { method: "POST", body: fd });
            alert("Asistencia registrada");
            document.getElementById("attendanceModal").classList.remove("active");
        };
        document.getElementById("closeAttendanceModal").onclick = () => document.getElementById("attendanceModal").classList.remove("active");
        document.getElementById("adminBtn").onclick = () => document.getElementById("adminModal").classList.add("active");
        document.getElementById("closeAdminModal").onclick = () => document.getElementById("adminModal").classList.remove("active");
        document.getElementById("loginAdminBtn").onclick = () => {
            if(document.getElementById("adminPass").value === "admin123") document.getElementById("adminPanel").style.display = "block";
            else alert("Contraseña incorrecta");
        };
        document.getElementById("darkModeToggle").onclick = () => {
            document.body.classList.toggle("dark-mode");
            localStorage.setItem("dark", document.body.classList.contains("dark-mode"));
        };
        if(localStorage.getItem("dark") === "true") document.body.classList.add("dark-mode");
        window.onclick = (e) => { if(e.target.classList.contains("modal")) e.target.classList.remove("active"); };
    });
</script>
</body>
</html>
